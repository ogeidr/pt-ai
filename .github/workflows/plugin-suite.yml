# Tier-1 plugin tests (mechanical): build parity, runtime-hook behavior, and
# structural validation of the generated plugin/ tree. VM-free — runs on a plain
# Linux runner with only jq (preinstalled on ubuntu-latest). The functional tier
# (install + drive Claude Code) is NOT here; it needs an authed Claude Code and
# runs in the Vagrant VM (test/plugin-functional.sh).
#
# This job is also the definitive GNU-sed portability check: plugin/ is committed
# after a BSD-sed build on macOS, and `parity` here rebuilds under GNU sed and
# diffs — a divergence fails loudly with the exact diff.
name: plugin-suite

on:
  push:
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'tools/**'
      - 'plugin/**'
      - 'test/**'
      - 'vagrant/config/claude/hooks/**'
      - '.github/workflows/plugin-suite.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'tools/**'
      - 'plugin/**'
      - 'test/**'
      - 'vagrant/config/claude/hooks/**'
      - '.github/workflows/plugin-suite.yml'

jobs:
  mechanical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tool versions (sed/awk portability context)
        run: |
          sed --version | head -1
          jq --version
          awk -W version 2>&1 | head -1 || awk --version 2>&1 | head -1 || true
      - name: Run Tier-1 plugin suite (parity + hooks + validate + cvss)
        run: bash test/plugin-suite.sh
      # The VM runs gawk (Kali) but bento/debian-13 runs mawk, and nothing in
      # vagrant/config/tools.txt installs gawk — so pin each implementation here
      # rather than discovering a divergence 30-60 min into a Debian provision.
      - name: CVSS math under each awk implementation
        run: |
          sudo apt-get install -y -qq mawk gawk
          for a in mawk gawk; do
            printf '=== %s: ' "$a"; "$a" -W version 2>&1 | head -1 || "$a" --version 2>&1 | head -1
            AWK="$a" sh skills/severity-calibrate/scripts/cvss.test.sh
          done
